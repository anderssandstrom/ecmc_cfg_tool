name: Publish validated hardware snapshot
on:
  push:
    branches: [feature/native-hardware-diagnostics]
    paths:
      - '.github/workflows/publish-hardware-snapshot.yml'
      - 'test_hardware_expansion.py'
      - 'test_full_generated_catalog.py'
      - 'ecmc_generated_catalog.py'
      - 'build_hardware_catalog.py'
      - 'ecmc_hardware_inventory.py'
      - 'ecmc_hardware_database.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-and-publish:
    if: github.repository == 'anderssandstrom/ecmc_cfg_tool' && github.ref == 'refs/heads/feature/native-hardware-diagnostics'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      QT_QPA_PLATFORM: offscreen
      EPICS_CA_AUTO_ADDR_LIST: 'NO'
      EPICS_CA_ADDR_LIST: '127.0.0.1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: anderssandstrom/ecmccfg
          ref: b5ab819ddea57c08a74c8c74e6dc1eb78384b5a0
          path: upstream-cfg
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate pinned snapshot
        run: python build_hardware_catalog.py upstream-cfg --source "ecmccfg v11.2.1_RC1" --source-commit b5ab819ddea57c08a74c8c74e6dc1eb78384b5a0 --output ecmc_hardware_generated.json
      - name: Install offline test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3
          python -m pip install PyQt5 pyyaml
      - name: Validate snapshot and application
        run: |
          python -m unittest test_full_generated_catalog -v
          python -m unittest discover -v
      - name: Commit only the validated generated snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- ecmc_hardware_generated.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Bundle validated ECMCCFG hardware catalogue snapshot"
          git push origin HEAD:refs/heads/feature/native-hardware-diagnostics
